services:
  db:
    image: postgres:latest  # Usa la imagen oficial directamente
    container_name: postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=IK008626
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  python_app:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: python_worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=IK008626
      - DB_NAME=postgres
    ports:
      - "8501:8501"

